<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <!-- Background Midnight Mesh -->
    <linearGradient id="tvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0822" />
      <stop offset="60%" stop-color="#0A1028" />
      <stop offset="100%" stop-color="#071938" />
    </linearGradient>

    <!-- Glowing Violet/Blue Radial Orbs -->
    <radialGradient id="violetOrb" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.0" />
    </radialGradient>

    <radialGradient id="blueOrb" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0" />
    </radialGradient>

    <linearGradient id="iconGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#tvBg)" />
  <rect width="640" height="360" fill="url(#violetOrb)" />
  <rect width="640" height="360" fill="url(#blueOrb)" />

  <!-- Left Frosted Icon (220x220) -->
  <g transform="translate(60, 70)">
    <!-- Squircle Gradient -->
    <rect width="220" height="220" rx="52" ry="52" fill="url(#iconGradient)" />
    <!-- Glass Inner Plate -->
    <rect x="18" y="18" width="184" height="184" rx="42" ry="42"
          fill="rgba(255, 255, 255, 0.35)"
          stroke="rgba(255, 255, 255, 0.75)"
          stroke-width="2" />
    <!-- Specular Highlight -->
    <path d="M 18 60 A 42 42 0 0 1 60 18 L 160 18 A 42 42 0 0 1 202 60 L 202 95 L 18 95 Z"
          fill="rgba(255, 255, 255, 0.20)" />

    <!-- Centered Layered Flower Cube -->
    <g transform="translate(48, 42) scale(0.85)">
      <!-- Top Diamond -->
      <path d="M75 18 L132 50 L75 82 L18 50 Z" fill="#000000" />
      <!-- Flower Center & Petals -->
      <circle cx="75" cy="50" r="4.5" fill="#FFFFFF" />
      <ellipse cx="75" cy="38" rx="4" ry="7" fill="#FFFFFF" />
      <ellipse cx="75" cy="62" rx="4" ry="7" fill="#FFFFFF" />
      <ellipse cx="64.5" cy="44" rx="4" ry="7" transform="rotate(-60 64.5 44)" fill="#FFFFFF" />
      <ellipse cx="85.5" cy="56" rx="4" ry="7" transform="rotate(-60 85.5 56)" fill="#FFFFFF" />
      <ellipse cx="64.5" cy="56" rx="4" ry="7" transform="rotate(60 64.5 56)" fill="#FFFFFF" />
      <ellipse cx="85.5" cy="44" rx="4" ry="7" transform="rotate(60 85.5 44)" fill="#FFFFFF" />

      <!-- Isometric Faces -->
      <path d="M18 53 L75 85 L75 130 L18 98 Z" fill="#000000" />
      <path d="M75 85 L132 53 L132 98 L75 130 Z" fill="#000000" />

      <!-- Wavy Layers -->
      <path d="M18 68 Q32 76 46 72 Q60 68 75 76 Q90 68 104 72 Q118 76 132 68 L132 75 Q118 83 104 79 Q90 75 75 83 Q60 75 46 79 Q32 83 18 75 Z" fill="#FFFFFF" />
      <path d="M18 83 Q32 91 46 87 Q60 83 75 91 Q90 83 104 87 Q118 91 132 83 L132 90 Q118 98 104 94 Q90 90 75 98 Q60 90 46 94 Q32 98 18 90 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography Right Side: BloomAir -->
  <text x="320" y="160" font-family="'Ubuntu', -apple-system, sans-serif" font-weight="700" font-size="52" fill="#FFFFFF" letter-spacing="1">BloomAir</text>
  <text x="320" y="205" font-family="'Ubuntu', -apple-system, sans-serif" font-weight="500" font-size="20" fill="#DDD6FE">Ultra-Low Latency AirPlay TV</text>

  <!-- Frosted Specs Badge -->
  <g transform="translate(320, 235)">
    <rect width="250" height="38" rx="19" ry="19" fill="rgba(37, 99, 235, 0.25)" stroke="rgba(124, 58, 237, 0.50)" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#10B981" />
    <text x="36" y="25" font-family="'Ubuntu', sans-serif" font-weight="700" font-size="13" fill="#93C5FD">1080p60 • &lt; 40ms SYNC</text>
  </g>
</svg>
